# Wakes the bot every 15 minutes so it can send words of the day and reminders.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   API_URL      e.g. https://nihongo-api.vercel.app   (no trailing slash)
#   CRON_SECRET  the same value as CRON_SECRET on the API
name: bot-schedule

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}        # "Run workflow" button for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /cron
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set the API_URL and CRON_SECRET repository secrets first."; exit 1
          fi
          curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$API_URL/cron"
